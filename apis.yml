aid: habi
name: Habi
description: 'Habi is a Colombian real estate technology company (proptech) that operates as a
  direct home buyer and seller — an iBuyer model where Habi itself purchases apartments in cash,
  typically within 10 days, rather than acting as a traditional agency. It operates across Bogota,
  Medellin, Cali, Barranquilla and 20+ Colombian cities and is expanding into Mexico. Products
  include Habimetro (an online property valuation simulator), property listings and search, Habi
  Credit (mortgage financing), Habi Inmobiliaria (assisted longer-term sales), and an allied-agent
  partner network. The company reports 40,000+ families served, 4,000+ allied real estate agents,
  and 550+ real estate experts. Backed by Homebrew. This profile was added to the API Evangelist
  network and enriched from Habi''s public surface; the company publishes no public developer API.'
